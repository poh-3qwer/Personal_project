{% extends 'base.html' %}
{% load static %}
{% block content %}
    <link rel="stylesheet" href="{% static 'bootstrap.min.css'%}">
    <link rel="stylesheet" href="{% static 'base.css'%}">
    <br>
    <h1 class="ms-3">Видалити акаунт</h1>
    <br>
    <h2 class="ms-3">Ви впевнені, що хочете видалити ваш акаунт?</h2>
    <form class="ms-3 custom-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Видалити</button>
    </form>
{% endblock %}
