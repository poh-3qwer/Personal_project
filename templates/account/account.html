{% extends 'base.html' %}
{% load static %}
{% block content %}
    <link rel="stylesheet" href="{% static 'bootstrap.min.css'%}">
    <link rel="stylesheet" href="{% static 'base.css'%}">
    <br>
    <div class="ms-3">
        <a role="button" class="btn btn-outline-primary" href="{% url 'account-detail' account.pk %}">Деталі</a>
    </div>
    <br>
    <div class="ms-3">
        {% if account.avatar %}
            <img class="rounded-[15px]" src="{{ account.avatar.url }}" alt="Аватар" width="200" height="200">
        {% else %}
            <img class="rounded-[15px]" src="{% static 'default_avatar.jpg' %}" alt="Аватар" width="200" height="200">
        {% endif %}
    </div>
    <br>
    <div class="ms-3">
        <h3>Ваш акаунт: </h3>
        <p>Їм'я: {{ account.human_name }}</p>
        <p>Фамілія: {{ account.human_surname }}</p>
        <p>Роль: {{ account.role }}</p>
        <p>Дата реєстрації: {{ account.date_of_registration }}</p>
    </div>
{% endblock %}
