{% extends 'base.html' %}
{% load static %}
{% block content %}

    <link rel="stylesheet" href="{% static 'base.css'%}">
    <br>
    <h1 class="ms-3">Додати товар</h1>

        {{ form.as_p }}

    </form>
{% endblock %}
