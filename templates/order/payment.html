<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Оплата замовлення</h1>

    <h3>До сплати: {{ order.total_price }}</h3>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Сплатити</button>
    </form>
    <a href="{% url 'order-detail' order_id=order.id %}">Повернутися</a>
</body>
</html>
