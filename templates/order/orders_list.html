{% extends 'base.html' %}
{% load static %}
{% block content %}
    <link rel="stylesheet" href="{% static 'bootstrap.min.css'%}">
    <link rel="stylesheet" href="{% static 'base.css'%}">
    <br>
    <h1 class="ms-3">Список замовленнь</h1>
    <br>
    <div class="d-flex flex-wrap gap-2 ms-3">
        {% for order in orders_list %}
            <a role="button" class="btn btn-primary" href="{% url 'order-detail' order_id=order.id %}"> Замовлення {{ order.id }}</a>
        {% endfor %}
    </div>
{% endblock %}
